common:
  # 机器狗原始数据话题：保持采集端原始格式，不再伪装成 Livox Avia 话题。
  img_topic: "/front_camera/image_compressed"
  lid_topic: "/front_lidar"
  imu_topic: "/front_lidar/imu"
  img_en: 1
  lidar_en: 1
  # 机器狗相机原始数据为 sensor_msgs/CompressedImage，FAST-LIVO2 内部直接解码。
  img_compressed: true
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR → IMU: 来自 lidar_front_to_imu_front (纯平移, 无旋转)
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # Camera ← LiDAR: 从 camera_front_to_lidar_front 求逆得到
  Rcl: [-0.00017680004575335042,-0.9999850942958,-0.005454021750385471,
         0.24715569679395047,0.005241120060100726,-0.968961610016522,
         0.968975756368796,-0.0015193013562476718,0.24715109467522922]
  Pcl: [-0.007051528112941402,-0.1547747748641233,-0.012845815781130435]

time_offset:
  imu_time_offset: 0.0
  # 机器狗原始数据已保留 LiDAR/IMU/Camera 的 header.stamp，默认不额外补偿。
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  # 机器狗 PointCloud2 原生解析分支，对应 include/common_lib.h 中的 ROBOTDOG = 8。
  lidar_type: 8
  # 当前机器狗 /front_lidar 的 line 字段为 0~3，共 4 条扫描线。
  scan_line: 4
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 2
  blind_rgb_points: 0.5

evo:
  seq_name: "robotdog"
  pose_output_en: false

# 为在线 LiDAR 回环保存关键帧点云及同时刻的 IMU 位姿。
# 默认禁止覆盖已有位姿文件，防止混入旧关键帧。
loop_closure:
  keyframe_save_en: true
  keyframe_dir: "Log/pcd/loop_keyframes_robotdog"
  keyframe_overwrite: false
  keyframe_translation_m: 1.5
  keyframe_rotation_deg: 10.0
  keyframe_min_interval_s: 0.5
  skip_initialization_s: 5.0

# 前端仍固定在 camera_init(odom) 中连续定位；本模块仅发布 map 中的优化结果，
# 不会修改 FAST-LIVO2 的 _state 或活动体素地图。
loop_backend:
  online_enable: true
  # 后台轮询频率；单次优化在独立线程运行，不阻塞 LIO/VIO 前端。
  online_frequency_hz: 0.2
  # 累积至少这么多新关键帧后才重新构建快照，控制在线计算开销。
  online_min_new_keyframes: 5
  # 收到 Ctrl-C 后冲刷尾部关键帧、执行最终优化并导出结果。
  export_on_shutdown: true
  # 每次新建图请改为新目录；默认不覆盖旧的最终优化结果。
  output_dir: "Log/loop_backend_robotdog"
  output_overwrite: false

  # 以下参数已由机器狗首尾回环数据验证。
  candidate_radius_m: 10.0
  min_time_separation_s: 30.0
  min_keyframe_index_gap: 20
  history_keyframes_each_side: 20
  icp_voxel_leaf_m: 0.40
  icp_max_correspondence_m: 150.0
  icp_max_iterations: 100
  icp_fitness_threshold: 0.40
  min_current_points: 100
  min_history_points: 300
  odom_rotation_sigma_rad: 0.02
  odom_translation_sigma_m: 0.10
  loop_rotation_sigma_rad: 0.10
  loop_translation_sigma_min_m: 0.05
  loop_translation_sigma_max_m: 1.00
  # 在线发布的全局关键帧地图体素大小；它不影响前端局部地图。
  global_map_leaf_m: 0.20

# 建图时缓存彩色世界系点云批次；最终优化完成后自动导出全局地图。
dense_global_map:
  enabled: true
  cache_dir: "Log/dense_rgb_cache_robotdog"
  # 队列满时短暂等待磁盘写入，以确保稠密 RGB 点不丢失。
  cache_queue_size: 8
  # 0 表示不降采样：保留所有 RGB 点，与 all_raw_points.pcd 的稠密度一致。
  auto_export_on_shutdown: true
  auto_export_voxel_leaf_m: 0.0
  # 所有最终交付结果统一放在 Log/pcd，与原 FAST-LIVO2 的组织方式一致。
  output_path: "Log/pcd/all_global_optimized_rgb_dense_full.pcd"
  # 仅在最终稠密 RGB PCD 成功后删除缓存、关键帧、稀疏中间地图和原始轨迹文本。
  cleanup_intermediate_on_success: false

# Product-map v4 observation sidecar.  It is disabled for ordinary mapping and
# only records provenance for the existing dense RGB cache when explicitly
# enabled by the dedicated scene-evidence launch file.
scene_evidence_export:
  enabled: false
  output_dir: "Log/scene_evidence"
  overwrite: false

pcd_save:
  # 导出建图结果给远程查看时开启；正常退出后保存 Log/pcd 下的 PCD 地图和轨迹。
  pcd_save_en: true
  # 阶段 4 的受控 launcher 会覆盖到每次运行各自的 map/ 子目录，避免 raw 和
  # filtered 的地图及轨迹相互覆盖；常规默认建图仍使用这一原始位置。
  output_dir: "Log/pcd"
  type: 0 # 0: World Frame, 1: Body Frame
  colmap_output_en: false
  filter_size_pcd: 0.20
  interval: -1

image_save:
  img_save_en: false
  interval: 1
