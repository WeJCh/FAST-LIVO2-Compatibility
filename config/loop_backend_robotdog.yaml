# Offline loop-closure / pose-graph optimization parameters for RobotDog data.
# These values are deliberately conservative. Tune candidate_radius_m and
# icp_fitness_threshold only after inspecting loop_edges.csv and the output PCD.
loop_backend:
  # Candidate search. A candidate must satisfy all three conditions.
  candidate_radius_m: 10.0
  min_time_separation_s: 30.0
  min_keyframe_index_gap: 20

  # Build the ICP target from this many neighbouring historical keyframes.
  history_keyframes_each_side: 20

  # ICP verification.
  icp_voxel_leaf_m: 0.40
  icp_max_correspondence_m: 150.0
  icp_max_iterations: 100
  icp_fitness_threshold: 0.40
  min_current_points: 100
  min_history_points: 300

  # Pose-graph uncertainty. Smaller values give a constraint more weight.
  odom_rotation_sigma_rad: 0.02
  odom_translation_sigma_m: 0.10
  loop_rotation_sigma_rad: 0.10
  loop_translation_sigma_min_m: 0.05
  loop_translation_sigma_max_m: 1.00

  # Output map downsampling. Set to 0 to disable final voxel filtering.
  global_map_leaf_m: 0.20
